<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="tok" content="__TOKEN__">
<title>Сканер системы</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%236ea8ff' d='M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0c0e12; --panel:#12151b; --panel2:#171b22; --line:#232832; --line2:#2d3440;
  --text:#e7eaf0; --dim:#8b94a3; --faint:#5d6674;
  --accent:#6ea8ff; --accent-bg:rgba(110,168,255,.12);
  --danger:#ff5f70; --warn:#ffb454; --note:#8fa3c4; --ok:#3ddc97;
  --danger-bg:rgba(255,95,112,.12); --warn-bg:rgba(255,180,84,.12); --note-bg:rgba(143,163,196,.12); --ok-bg:rgba(61,220,151,.1);
  --shadow:0 20px 60px rgba(0,0,0,.5);
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --line:#e3e6ec; --line2:#d3d8e0;
    --text:#161a21; --dim:#667085; --faint:#98a2b3;
    --accent:#2f6df6; --accent-bg:rgba(47,109,246,.09);
    --danger:#e5304a; --warn:#d9822b; --note:#6b7f9e; --ok:#12a66a;
    --danger-bg:rgba(229,48,74,.09); --warn-bg:rgba(217,130,43,.1); --note-bg:rgba(107,127,158,.1); --ok-bg:rgba(18,166,106,.09);
    --shadow:0 20px 50px rgba(20,30,50,.18);
  }
}
*{box-sizing:border-box}
html{height:calc(100vh / var(--z,1));overflow:hidden}
body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
::selection{background:var(--accent-bg)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:content-box;min-height:40px}
::-webkit-scrollbar-thumb:hover{background:var(--faint);border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}
html{zoom:var(--z,1)}
.zgrp{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:9px;height:34px;overflow:hidden}
.zgrp button{border:0;background:none;width:30px;height:100%;color:var(--dim);font-size:16px;line-height:1}
.zgrp button:hover{background:var(--panel2);color:var(--text)}
.zgrp .zv{min-width:46px;text-align:center;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;cursor:pointer;border:0;background:none;width:auto;padding:0 4px}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100%}

/* ---------- sidebar ---------- */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font-weight:600;letter-spacing:.2px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center}
.brand .logo svg{width:16px;height:16px}
.scanbtn{margin:2px 14px 14px;padding:11px 14px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;transition:filter .15s,transform .05s}
@media (prefers-color-scheme:light){.scanbtn{color:#fff}}
.scanbtn:hover{filter:brightness(1.08)}
.scanbtn:active{transform:translateY(1px)}
.scanbtn[disabled]{cursor:progress;filter:none}
.scanbtn .bar{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.55);width:0;transition:width .25s}
.nav{flex:1;overflow:auto;padding:0 8px 8px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);padding:14px 10px 6px}
.nav button{width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px;border:0;background:none;border-radius:8px;text-align:left;color:var(--dim);transition:background .12s,color .12s}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:var(--accent-bg);color:var(--text)}
.nav button.on svg{color:var(--accent)}
.nav .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11.5px;min-width:22px;text-align:center;padding:1px 7px;border-radius:20px;background:var(--panel2);color:var(--faint);font-variant-numeric:tabular-nums}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.spin{background:none;padding:0}
.side-foot{border-top:1px solid var(--line);padding:12px 14px;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:8px}
.side-foot .led{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.side-foot.lim .led{background:var(--warn)}
.side-foot a{margin-left:auto;color:var(--accent);cursor:pointer;text-decoration:none}
.side-foot a:hover{text-decoration:underline}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.top{display:flex;align-items:center;gap:12px;padding:16px 24px 6px}
.top h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.2px}
.top .desc{color:var(--dim);font-size:13px;margin-top:2px;max-width:70ch}
.top .ttl{flex:1;min-width:0}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--dim)}
.iconbtn:hover{color:var(--text);border-color:var(--line2)}
.menu{position:absolute;right:24px;top:56px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:6px;min-width:240px;box-shadow:var(--shadow);z-index:30;display:none}
.menu.open{display:block}
.menu button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;display:flex;gap:10px;align-items:center;color:var(--text)}
.menu button:hover{background:var(--panel2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}

.strip{display:flex;gap:10px;padding:10px 24px 4px;flex-wrap:wrap}
.stat{flex:1 1 130px;max-width:210px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,opacity .15s,background .15s}
.stat:hover{border-color:var(--line2)}
.stat .n{font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .t{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.stat .t i{width:7px;height:7px;border-radius:50%;display:inline-block}
.stat.danger .n{color:var(--danger)} .stat.danger i{background:var(--danger)}
.stat.warn .n{color:var(--warn)} .stat.warn i{background:var(--warn)}
.stat.note .n{color:var(--note)} .stat.note i{background:var(--note)}
.stat.ok .n{color:var(--ok)} .stat.ok i{background:var(--ok)}
.stat.off{opacity:.45;background:transparent}
.stat.zero .n{color:var(--faint)}

.verdict{padding:10px 24px 0;color:var(--dim);font-size:13px;display:flex;gap:8px;align-items:center;min-height:30px}
.verdict b{color:var(--text);font-weight:600}

.tools{display:flex;gap:10px;padding:12px 24px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 260px;position:relative;max-width:520px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 36px 0 36px;outline:0}
.search input:focus{border-color:var(--accent)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:11px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.sel{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 10px;outline:0;color:var(--text)}
.sel:focus{border-color:var(--accent)}
.custom{display:none;padding:0 24px 10px;gap:8px}
.custom.on{display:flex}
.custom input{flex:1;max-width:620px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 12px;outline:0;font-family:var(--mono);font-size:13px}
.custom input:focus{border-color:var(--accent)}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--dim)}
.btn.ghost:hover{color:var(--text)}
.btn[disabled]{opacity:.5;pointer-events:none}

.list{flex:1;overflow:auto;padding:0 16px 80px 24px;min-height:0}
.row{display:grid;grid-template-columns:22px 10px minmax(0,1fr) auto 38px;gap:12px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.row:hover{background:var(--panel)}
.row.act{background:var(--panel);border-color:var(--line2)}
.row + .row{margin-top:1px}
.chk{display:grid;place-items:center}
.chk input{appearance:none;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line2);background:none;margin:0;cursor:pointer;display:grid;place-items:center;transition:.1s}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.chk.none input{visibility:hidden}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);opacity:.55}
.lv-note .dot{background:var(--note);opacity:1}
.lv-warn .dot{background:var(--warn);opacity:1;box-shadow:0 0 0 3px var(--warn-bg)}
.lv-danger .dot{background:var(--danger);opacity:1;box-shadow:0 0 0 3px var(--danger-bg)}
.rmain{min-width:0}
.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .sub{color:var(--faint);font-weight:400;margin-left:8px;font-size:12.5px}
.row.lv-ok .nm{color:var(--dim)}
.pth{font:12px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tags{display:flex;gap:6px;align-items:center}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--panel2);color:var(--dim);white-space:nowrap}
.row:hover .tag{background:var(--bg)}
.tag.bad{background:var(--danger-bg);color:var(--danger)}
.tag.mid{background:var(--warn-bg);color:var(--warn)}
.tag.good{background:var(--ok-bg);color:var(--ok)}
.score{font:12px var(--mono);text-align:right;color:var(--faint);font-variant-numeric:tabular-nums}
.lv-danger .score{color:var(--danger)} .lv-warn .score{color:var(--warn)}
.more{display:block;margin:14px auto;}
.empty{display:grid;place-items:center;text-align:center;padding:70px 20px;color:var(--dim)}
.empty .big{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin-bottom:14px}
.empty .big svg{width:26px;height:26px}
.empty h3{margin:0 0 4px;color:var(--text);font-weight:600}
.empty p{margin:0 0 14px;max-width:46ch}
.skel{height:44px;border-radius:10px;margin:6px 0;background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.scanbtn .spinner{border-color:rgba(255,255,255,.35);border-top-color:#fff}

.bulk{position:absolute;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow);border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;transition:.18s;z-index:10}
.bulk.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}

/* ---------- drawer ---------- */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.18s;z-index:20}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--panel);border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.7,.2,1);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.dh{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{margin:0;font-size:17px;font-weight:600;word-break:break-all}
.dh .lvl{display:inline-flex;gap:6px;align-items:center;margin-top:6px;font-size:12.5px;padding:2px 10px;border-radius:20px}
.lvl.danger{background:var(--danger-bg);color:var(--danger)} .lvl.warn{background:var(--warn-bg);color:var(--warn)}
.lvl.note{background:var(--note-bg);color:var(--note)} .lvl.ok{background:var(--ok-bg);color:var(--ok)}
.db{flex:1;overflow:auto;padding:16px 22px}
.sect{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);margin:6px 0 8px}
.why{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:6px}
.why li{padding:8px 12px;border-radius:9px;background:var(--panel2);display:flex;gap:10px;align-items:flex-start}
.why li svg{color:var(--warn);margin-top:2px}
.why.clean li svg{color:var(--ok)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 14px;margin:0 0 16px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;word-break:break-all;font-size:13px}
.kv dd.m{font-family:var(--mono);font-size:12px}
.df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:40;background:rgba(0,0,0,.5)}
.modal.on{display:grid}
.mbox{width:min(760px,calc(100vw / var(--z,1) - 32px));max-height:calc((100vh - 40px) / var(--z,1));resize:horizontal;overflow:hidden;min-width:min(420px,calc(100vw / var(--z,1) - 32px));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow)}
.mbox h3{margin:0;padding:20px 22px 6px;font-size:17px}
.mbox p{margin:0;padding:0 22px 10px;color:var(--dim);font-size:13px}
.mlist{overflow:auto;margin:0 22px 12px;border:1px solid var(--line);border-radius:10px;max-height:min(40vh,360px);overscroll-behavior:contain}
.mlist div{padding:7px 12px;font-size:13px;border-bottom:1px solid var(--line);word-break:break-all}
.mlist div:last-child{border:0}
.mlist small{display:block;color:var(--faint);font:11.5px var(--mono)}
.mlist .err{color:var(--danger)}
.mf{padding:12px 22px 20px;display:flex;justify-content:flex-end;gap:8px}

.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow);border-radius:12px;padding:10px 14px;max-width:360px;animation:ti .2s}
.toast.bad{border-color:var(--danger)}
@keyframes ti{from{transform:translateY(10px);opacity:0}}

.row.lv-ack{opacity:.55}
.row.lv-ack .dot{background:var(--faint);opacity:1}
.stat.ack .n{color:var(--faint)} .stat.ack i{background:var(--faint)}
.lvl.ack{background:var(--panel2);color:var(--dim)}
.dmtabs{display:flex;gap:6px;padding:4px 22px 10px}
.home{display:grid;gap:18px;padding:6px 8px 40px 0;max-width:980px}
.hero{display:flex;gap:18px;align-items:center;padding:22px 24px;border-radius:18px;border:1px solid var(--line);background:var(--panel)}
.hero .hi{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ok-bg);color:var(--ok)}
.hero .hi svg{width:32px;height:32px;stroke-width:1.6}
.hero.danger{border-color:var(--danger);background:var(--danger-bg)} .hero.danger .hi{background:var(--danger-bg);color:var(--danger)}
.hero.warn{border-color:var(--warn);background:var(--warn-bg)} .hero.warn .hi{background:var(--warn-bg);color:var(--warn)}
.hero.idle .hi{background:var(--accent-bg);color:var(--accent)}
.hero h2{margin:0 0 4px;font-size:21px;letter-spacing:-.2px}
.hero p{margin:0;color:var(--dim);font-size:14px}
.hero .hb{margin-left:auto;display:flex;gap:8px;flex:none}
.hsec h3{margin:0 0 10px;font-size:15px;display:flex;gap:8px;align-items:center}
.hsec h3 small{font-weight:400;color:var(--faint);font-size:12.5px}
.issue{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:grid;gap:8px}
.issue.danger{border-left:3px solid var(--danger)} .issue.warn{border-left:3px solid var(--warn)}
.issue .it{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.issue .it b{font-size:15px;overflow-wrap:anywhere}
.issue .where{color:var(--faint);font-size:12.5px}
.issue .why{color:var(--dim);font-size:13.5px}
.issue .pth{margin:0;overflow-wrap:anywhere;white-space:normal}
.issue .ia{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--line2);background:var(--panel2)}
.tile b{font-size:13.5px;font-weight:600} .tile span{font-size:12.5px;color:var(--faint)}
.tile i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
.tile.warn i{background:var(--warn)} .tile.danger i{background:var(--danger)}
.chg{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:6px 16px}
.chg div{padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;overflow-wrap:anywhere;display:flex;gap:10px}
.chg div:last-child{border:0}
.chg .k{flex:none;min-width:70px;font-size:12px;padding:1px 8px;border-radius:6px;height:20px;text-align:center}
.chg .k.new{background:var(--warn-bg);color:var(--warn)} .chg .k.gone{background:var(--panel2);color:var(--dim)}
.dmtabs button{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--dim)}
.dmtabs button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--text)}
.dmgrp{padding:2px 22px 10px}
.dmgrp h4{margin:8px 0 2px;font-size:13.5px;font-weight:600}
.dmgrp p{margin:0 0 6px;padding:0;color:var(--dim);font-size:12.5px}
.dmgrp .mlist{margin:0 0 8px;max-height:150px}
.dmgrp .none{color:var(--faint);font-size:13px;padding:6px 2px}
.dmadd{display:flex;gap:8px}
.minput{flex:1;min-width:0;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);padding:0 10px;outline:0;font-family:var(--mono);font-size:12.5px}
.minput:focus{border-color:var(--accent)}
.dmnote{margin:0 22px 10px;padding:8px 12px;border-radius:9px;background:var(--warn-bg);color:var(--text);font-size:13px}
.setwrap{padding:0 8px 8px}
.setbtn{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);background:none;border-radius:8px;color:var(--dim)}
.setbtn:hover{color:var(--text);border-color:var(--line2);background:var(--panel2)}
.places{display:none;flex-wrap:wrap;gap:6px;padding:8px 24px 0}
.place{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:12.5px}
.place:hover{border-color:var(--line2);color:var(--text)}
.place i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.place b{font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
.place.warn i{background:var(--warn)} .place.warn{color:var(--text);border-color:var(--warn-bg)}
.place.danger i{background:var(--danger)} .place.danger{color:var(--text);border-color:var(--danger-bg)}
.place.busy i{background:var(--faint);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.chip.on{border-color:var(--accent);background:var(--accent-bg);color:var(--text)}
.chip{color:var(--dim)}
.sw{position:relative;width:38px;height:22px;flex:none}
.sw input{appearance:none;position:absolute;inset:0;margin:0;border-radius:22px;background:var(--line2);cursor:pointer;transition:.15s}
.sw input:checked{background:var(--accent)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;pointer-events:none}
.sw:has(input:checked)::after{transform:translateX(16px)}
.srow{display:flex;gap:14px;align-items:flex-start;padding:4px 22px 12px}
.srow .t{flex:1}.srow .t b{display:block;font-weight:600}.srow .t span{color:var(--dim);font-size:13px}
.shead{padding:14px 22px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint)}
.mlist .wl{display:flex;gap:10px;align-items:center}.mlist .wl>div{flex:1;min-width:0}
.mbody{overflow:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain;scroll-behavior:smooth;background:linear-gradient(var(--panel) 30%,transparent) top,linear-gradient(transparent,var(--panel) 70%) bottom,radial-gradient(farthest-side at 50% 0,rgba(0,0,0,.35),transparent) top,radial-gradient(farthest-side at 50% 100%,rgba(0,0,0,.35),transparent) bottom;background-repeat:no-repeat;background-size:100% 28px,100% 28px,100% 10px,100% 10px;background-attachment:local,local,scroll,scroll}
.mbox h3{flex:none;cursor:move;user-select:none}
.mbox h3::after{content:"⠿";float:right;color:var(--faint);font-weight:400;font-size:15px}.mf{flex:none;border-top:1px solid var(--line)}
.list,.drawer .dbody,.nav{overscroll-behavior:contain}
@media (max-width:900px){
  .app{grid-template-columns:64px minmax(0,1fr)}
  .setbtn span{display:none}.setbtn{justify-content:center}
  .brand span,.nav .lbl,.grp,.side-foot span,.side-foot a,.scanbtn span,.nav .pill{display:none}
  .brand{justify-content:center;padding:16px 0}
  .scanbtn{margin:2px 10px 10px;padding:10px}
  .nav button{justify-content:center}
  .tags .tag.cat{display:none}
  .top,.strip,.tools,.verdict,.custom{padding-left:16px;padding-right:16px}
}

/* ---------- сканирование ---------- */
async function scanCat(id,path){
  S.cats[id]={...(S.cats[id]||{}),busy:1};
  try{
    const r=await api('/api/scan?cat='+id+(path?'&path='+encodeURIComponent(path):''));
    for(const [k,v] of S.items) if(v.cat===id){S.items.delete(k);S.sel.delete(k)}
    if(r.ok){
      for(const it of r.items){it._h=(it.name+' '+it.sub+' '+it.detail+' '+it.path).toLowerCase();S.items.set(it.id,it)}
      S.cats[id]={ms:r.ms,n:r.items.length,trunc:r.truncated};
      S.gone[id]=r.gone||[];
    }else S.cats[id]={err:r.error};
  }catch(e){S.cats[id]={err:'нет связи со сканером'}}
  if(S.running)S.done++;
  draw();
}
async function scanAll(){
  if(S.running)return;
  const ids=CATS.filter(c=>c.id!=='custom'&&(!c.opt||S.set[c.opt])).map(c=>c.id);
  S.running=1;S.total=ids.length;S.done=0;S.t0=performance.now();
  S.items.clear();S.sel.clear();S.cats={};S.gone={};closeDrawer();
  ids.forEach(i=>S.cats[i]={busy:1});
  draw();
  const q=[...ids];
  const worker=async()=>{while(q.length)await scanCat(q.shift())};
  await Promise.all([worker(),worker(),worker(),worker()]);
  S.running=0;S.doneOnce=true;S.scanAt=new Date();S.elapsed=((performance.now()-S.t0)/1000).toFixed(1);
  draw();
  const f=[...S.items.values()].filter(i=>!i.ack&&(i.level==='danger'||i.level==='warn')).length;
  toast(f?`Анализ завершён за ${S.elapsed} с · требуют внимания: ${f}`:`Анализ завершён за ${S.elapsed} с · подозрительного не найдено`);
}

function openDrawer(id){S.open=id;drawDrawer();$('#drawer').classList.add('on');$('#shade').classList.add('on');drawList()}
function closeDrawer(){if(S.open==null&&!$('#drawer').classList.contains('on'))return;S.open=null;$('#drawer').classList.remove('on');$('#shade').classList.remove('on');drawList()}

/* ---------- действия ---------- */
function toast(t,bad){const d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.textContent=t;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),bad?6000:4000)}
function confirmRemove(ids){
  const items=ids.map(id=>S.items.get(id)).filter(Boolean);
  if(!items.length)return;
  const kinds=[...new Set(items.map(i=>i.action))];
  const note=kinds.map(k=>ACT[k][1]).join(' ');
  const m=$('#mbox');
  m.innerHTML=`<h3>${kinds.length===1?ACT[kinds[0]][0]:'Применить действие'}: ${items.length}</h3><p>${esc(note)}</p>
   <div class="mlist">${items.slice(0,200).map(i=>`<div>${esc(i.name)}<small>${esc(i.path||i.detail)}</small></div>`).join('')}${items.length>200?`<div>…и ещё ${items.length-200}</div>`:''}</div>
   <div class="mf"><button class="btn" id="mNo">Отмена</button><button class="btn danger" id="mYes">Подтвердить</button></div>`;
  $('#modal').classList.add('on');
  $('#mNo').onclick=()=>$('#modal').classList.remove('on');
  $('#mYes').onclick=async()=>{
    $('#mYes').disabled=true;
    const r=await api('/api/remove',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'ids='+items.map(i=>i.id).join(',')});
    const bad=[];let ok=0;
    for(const x of r.results){
      if(x.ok){ok++;S.items.delete(x.id);S.sel.delete(x.id);if(S.open===x.id)closeDrawer()}
      else bad.push(x)
    }
    $('#modal').classList.remove('on');
    draw();
    if(ok)toast(`Готово: ${ok}`);
    if(bad.length){
      m.innerHTML=`<h3>Не удалось: ${bad.length}</h3><p>${ok?`Успешно: ${ok}. `:''}Для части действий нужны права администратора.</p>
        <div class="mlist">${bad.map(x=>`<div>${esc(S.items.get(x.id)?.name||x.id)}<small class="err">${esc(x.error)}</small></div>`).join('')}</div>
        <div class="mf"><button class="btn primary" id="mOk">Понятно</button></div>`;
      $('#modal').classList.add('on');$('#mOk').onclick=()=>$('#modal').classList.remove('on');
    }
  };
}
function download(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportData(kind){
  const a=filtered();
  if(!a.length){toast('Нечего экспортировать',1);return}
  const stamp=new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  if(kind==='json')download(`scan-${stamp}.json`,'application/json',JSON.stringify(a.map(({_h,...r})=>r),null,2));
  else{
    const cols=['level','risk','cat','name','sub','detail','path','sig','state','size','mtime','reasons'];
    const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    download(`scan-${stamp}.csv`,'text/csv',cols.join(',')+'\r\n'+a.map(r=>cols.map(c=>q(c==='reasons'?r.reasons.join('; '):r[c])).join(',')).join('\r\n'));
  }
}

$('#drawer').onclick=async e=>{
  const i=S.items.get(S.open);if(!i)return;
  if(e.target.closest('#dClose'))closeDrawer();
  else if(e.target.closest('#dCopy')){try{await navigator.clipboard.writeText(i.full||i.path||i.detail);toast('Путь скопирован')}catch(_){toast('Не удалось скопировать',1)}}
  else if(e.target.closest('#dReveal')){const r=await api('/api/reveal?id='+i.id,{method:'POST'});if(!r.ok)toast(r.error,1)}
  else if(e.target.closest('#dAct'))confirmRemove([i.id]);
  else if(e.target.closest('#dPurge'))purgeFile(i);
  else if(e.target.closest('#dBoth'))removeBoth(i);
  else if(e.target.closest('#dHEdit'))openHostEdit(i);
  else if(e.target.closest('#dHDel'))hostDelete(i);
  else if(e.target.closest('#dAck'))ackItems([i.id],true);
  else if(e.target.closest('#dUnack'))ackItems([i.id],false);

    if(S.open===i.id)drawDrawer();
    if(!r.ok)toast(r.error,1);
    else if(r.result==='clean')toast('Защитник Windows: угроз не найдено');
    else if(r.result==='threat')toast('Защитник Windows обнаружил угрозу в этом файле!',1);
    else toast('Защитник не смог завершить проверку (код '+r.code+')',1);
  }
};
function applyItems(list){

async function trust(ids,add){

  applyItems(r.items||[]);
  S.sel.clear();drawBulk();

async function ackItems(ids,on){

/* ---------- управление Защитником Windows ---------- */
const DM={
  excl:[
    {k:'xp',t:'Папки и файлы',d:'Защитник не проверяет эти пути.',ph:'C:\\Путь\\к\\папке или файлу'},
    {k:'xe',t:'Расширения',d:'Файлы с этими расширениями не проверяются.',ph:'например: iso'},
    {k:'xr',t:'Процессы',d:'Файлы, которые открывает этот процесс, не проверяются.',ph:'имя.exe или полный путь'}],
  cfa:[
    {k:'pf',t:'Защищённые папки',d:'Только доверенные приложения могут изменять файлы в этих папках.',ph:'C:\\Путь\\к\\папке'},
    {k:'aa',t:'Разрешённые приложения',d:'Приложения, которым разрешено менять защищённые папки (белый список).',ph:'C:\\Путь\\к\\программе.exe'}]
};
const CFA_TXT={'0':'выключен','1':'включён','2':'только аудит (без блокировки)'};
let dm=null,dmTab='excl',dmEdit=null;
async function openDefMan(){
  dm=null;dmEdit=null;renderDefMan();$('#modal').classList.add('on');
  try{dm=await api('/api/defender/prefs')}catch(e){dm={ok:false,error:'нет связи со сканером'}}
  renderDefMan();
}
function renderDefMan(){
  const m=$('#mbox');
  let body;
  if(!dm)body='<div class="skel" style="margin:0 22px"></div><div class="skel" style="margin:6px 22px"></div>';
  else if(!dm.ok)body=`<p>${esc(dm.error)}</p>`;
  else{
    const note=!dm.admin?'<div class="dmnote">Сканер запущен без прав администратора: Windows скрывает эти списки и запрещает их менять. Нажми «Повысить» слева внизу.</div>'
      :dm.hidden?'<div class="dmnote">Windows скрыла часть списков.</div>':'';
    const cfa=dmTab==='cfa'?`<p>Контролируемый доступ к папкам: <b>${esc(CFA_TXT[dm.cfa]||dm.cfa)}</b>${dm.cfa==='0'?'. Пока он выключен, защищённые папки не действуют — включается в «Безопасность Windows».':'.'}</p>`:'';
    body=note+cfa+DM[dmTab].map(g=>{
      const list=dm[g.k]||[];
      const editing=dmEdit&&dmEdit.k===g.k;
      return `<div class="dmgrp"><h4>${g.t}</h4><p>${g.d}</p>
        ${list.length?`<div class="mlist">${list.map(v=>`<div class="wl"><div style="font-family:var(--mono);font-size:12.5px">${esc(v)}</div><button class="btn ghost" data-a="edit" data-k="${g.k}" data-v="${esc(v)}">Изменить</button><button class="btn ghost" data-a="del" data-k="${g.k}" data-v="${esc(v)}">Удалить</button></div>`).join('')}</div>`:'<div class="none">Список пуст</div>'}
        <div class="dmadd"><input class="minput" data-in="${g.k}" placeholder="${esc(g.ph)}" spellcheck="false" value="${editing?esc(dmEdit.old):''}"><button class="btn primary" data-a="add" data-k="${g.k}">${editing?'Сохранить':'Добавить'}</button></div></div>`;
    }).join('');
  }
  m.innerHTML=`<h3>Управление Защитником Windows</h3>
    <div class="dmtabs"><button data-tab="excl" class="${dmTab==='excl'?'on':''}">Исключения</button><button data-tab="cfa" class="${dmTab==='cfa'?'on':''}">Защищённые папки</button></div>
    <div class="mbody">${body}</div><div class="mf"><button class="btn primary" id="dmOk">Готово</button></div>`;
  $('#dmOk').onclick=()=>{$('#modal').classList.remove('on');if(S.view==='defender')scanCat('defender')};
  m.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{dmTab=b.dataset.tab;dmEdit=null;renderDefMan()});
  m.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>dmAct(b.dataset.a,b.dataset.k,b.dataset.v));
  m.querySelectorAll('[data-in]').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')m.querySelector(`[data-a=add][data-k=${i.dataset.in}]`).click()});
}
async function dmChange(kind,op,value){
  const r=await api('/api/defender/change',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'kind='+kind+'&op='+op+'&value='+encodeURIComponent(value)}).catch(()=>({ok:false,error:'нет связи со сканером'}));
  if(!r.ok)toast(r.error,1);
  return r.ok;
}
async function dmAct(a,k,v){
  const reload=async()=>{dm=await api('/api/defender/prefs');renderDefMan()};
  if(a==='edit'){dmEdit={k,old:v};renderDefMan();const i=$('#mbox').querySelector(`[data-in=${k}]`);i&&i.focus();return}
  if(a==='del'){
    if(!confirm('Убрать из списка?\n\n'+v))return;
    if(await dmChange(k,'remove',v)){toast('Удалено');dmEdit=null;await reload()}
    return;
  }
  const inp=$('#mbox').querySelector(`[data-in=${k}]`),val=inp.value.trim();
  if(!val){inp.focus();return}
  if(k==='xp'||k==='xe'||k==='xr'){
    if(!confirm('Добавить в исключения Защитника?\n\n'+val+'\n\nЗащитник перестанет проверять это. Вредоносные программы часто прячутся именно так — добавляй только то, чему доверяешь.'))return;
  }
  const edit=dmEdit&&dmEdit.k===k?dmEdit.old:null;
  if(edit===val){dmEdit=null;renderDefMan();return}
  if(await dmChange(k,'add',val)){
    if(edit&&!await dmChange(k,'remove',edit))toast('Новое значение добавлено, но старое удалить не удалось',1);
    toast(edit?'Изменено':'Добавлено');dmEdit=null;await reload();
  }
}
$('#defMan').onclick=openDefMan;
/* окна можно перетаскивать за заголовок; положение сбрасывается при закрытии */
(()=>{
  const box=$('#mbox'),modal=$('#modal');let ox=0,oy=0,drag=null;
  const apply=()=>{box.style.transform=`translate(${ox}px,${oy}px)`};
  box.addEventListener('mousedown',e=>{
    const h=e.target.closest('h3');if(!h||e.button!==0)return;
    drag={x:e.clientX,y:e.clientY,ox,oy};e.preventDefault();document.body.style.userSelect='none';
  });
  document.addEventListener('mousemove',e=>{
    if(!drag)return;
    const z=S.zoom||1,r=box.getBoundingClientRect();
    let nx=drag.ox+(e.clientX-drag.x)/z,ny=drag.oy+(e.clientY-drag.y)/z;
    // не даём утащить заголовок за пределы экрана
    const dx=(nx-ox)*z,dy=(ny-oy)*z;
    if(r.top+dy<0)ny=oy-r.top/z;
    if(r.top+dy>innerHeight-50)ny=oy+(innerHeight-50-r.top)/z;
    if(r.right+dx<80)nx=ox+(80-r.right)/z;
    if(r.left+dx>innerWidth-80)nx=ox+(innerWidth-80-r.left)/z;
    ox=nx;oy=ny;apply();
  });
  document.addEventListener('mouseup',()=>{if(drag){drag=null;document.body.style.userSelect=''}});
  new MutationObserver(()=>{if(!modal.classList.contains('on')){ox=oy=0;apply()}}).observe(modal,{attributes:true,attributeFilter:['class']});
})();
/* ---------- редактирование файла hosts ---------- */
function openHostEdit(i){
  $('#mbox').innerHTML=`<h3>${i?'Изменить запись hosts':'Новая запись hosts'}</h3>
   <p>Файл hosts связывает имя сайта с IP-адресом: например, 127.0.0.1 и example.com блокирует этот сайт. Перед изменением сканер сохраняет копию файла в папку hosts_backups рядом с собой.</p>
   <div class="mbody"><div style="padding:4px 22px 12px;display:grid;gap:12px">
    <label style="display:grid;gap:6px;color:var(--dim);font-size:13px">IP-адрес<input class="minput" id="hIp" placeholder="127.0.0.1" value="${esc(i?i.sub:'')}"></label>
    <label style="display:grid;gap:6px;color:var(--dim);font-size:13px">Имя сайта (можно несколько через пробел)<input class="minput" id="hNm" placeholder="example.com" value="${esc(i?i.name:'')}"></label>
    <div id="hErr" style="color:var(--danger);font-size:13px;min-height:18px"></div>
   </div></div>
   <div class="mf"><button class="btn ghost" id="hCancel">Отмена</button><button class="btn primary" id="hSave">Сохранить</button></div>`;
  $('#modal').classList.add('on');
  setTimeout(()=>$(i?'#hNm':'#hIp').focus(),30);
  $('#hCancel').onclick=()=>$('#modal').classList.remove('on');
  const save=async()=>{
    const b=$('#hSave');b.disabled=true;
    const r=await api('/api/hosts/change',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'op='+(i?'edit':'add')+'&old='+encodeURIComponent(i?i.detail:'')+'&ip='+encodeURIComponent($('#hIp').value)+'&names='+encodeURIComponent($('#hNm').value)}).catch(()=>({ok:false,error:'нет связи со сканером'}));
    b.disabled=false;
    if(!r.ok){$('#hErr').textContent=r.error||'не удалось сохранить';return}
    $('#modal').classList.remove('on');closeDrawer();toast(i?'Запись изменена':'Запись добавлена');scanCat('hosts');
  };
  $('#hSave').onclick=save;
  $('#mbox').querySelectorAll('input').forEach(x=>x.onkeydown=e=>{if(e.key==='Enter')save()});
}
async function removeBoth(i){
  const sep=String.fromCharCode(10)+String.fromCharCode(10);
  if(!confirm(['Удалить запись и сам файл?',i.name+' — '+(i.detail||''),i.path,'Запись будет убрана из системы, а файл удалён навсегда (без карантина).'].join(sep)))return;
  const r=await api('/api/remove',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'mode=both&ids='+i.id}).catch(()=>({results:[{ok:false,error:'нет связи со сканером'}]}));
  const x=(r.results||[])[0]||{ok:false,error:r.error||'не удалось'};
  if(!x.ok){toast(x.error||'не удалось удалить',true);return}
  S.items.delete(i.id);S.sel.delete(i.id);closeDrawer();draw();
  x.warn?toast(x.warn,true):toast('Запись и файл удалены');
}
function homeIssues(){return[...S.items.values()].filter(i=>!i.ack&&!i.wl&&(i.level==='danger'||i.level==='warn')).sort((a,b)=>b.risk-a.risk||a.name.localeCompare(b.name,'ru'))}
function recommend(i){
  if(i.cat==='defender')return{l:'Прочитано — убрать в архив',k:'ack'};
  if(i.action==='quarantine')return{l:'В карантин',k:'rm'};
  if(['regdel','taskdel','svcdel'].includes(i.action))return i.path&&i.sig!=='system'&&i.sig!=='missing'?{l:'Удалить запись и файл',k:'both'}:{l:'Удалить запись',k:'rm'};
  if(i.action==='kill')return{l:'Завершить процесс',k:'rm'};
  return null;
}
function drawHome(){
  const L=$('#list');
  const all=[...S.items.values()].filter(i=>!i.ack);
  const c=counts(all),arch=S.items.size-all.length;
  const iss=homeIssues();
  let hero;
  if(S.running)hero=`<div class="hero idle"><div class="hi"><span class="spinner"></span></div><div><h2>Проверяю компьютер…</h2><p>Готово ${S.done} из ${S.total} разделов. Результаты появятся здесь сами.</p></div></div>`;
  else if(!S.doneOnce)hero=`<div class="hero idle"><div class="hi">${ic.shield}</div><div><h2>Проверьте компьютер</h2><p>Нажмите кнопку — за несколько секунд я покажу, есть ли угрозы и что с ними делать.</p></div><div class="hb"><button class="btn primary" id="hScan">Проверить сейчас</button></div></div>`;
  else{
    const when=S.scanAt?S.scanAt.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}):'';
    const meta=`Проверено элементов: ${all.length+arch} за ${S.elapsed} с · ${when}`;
    const btnScan='<div class="hb"><button class="btn" id="hScan">Проверить снова</button></div>';
    if(c.danger)hero=`<div class="hero danger"><div class="hi">${ic.warn}</div><div><h2>Найдены угрозы: ${c.danger}</h2><p>${meta}. Ниже — что именно и что с этим сделать.</p></div>${btnScan}</div>`;
    else if(c.warn)hero=`<div class="hero warn"><div class="hi">${ic.warn}</div><div><h2>Нужно проверить: ${c.warn}</h2><p>${meta}. Это не обязательно вирусы: чаще всего это программы без цифровой подписи. Ниже — самые важные.</p></div>${btnScan}</div>`;
    else hero=`<div class="hero"><div class="hi">${ic.ok}</div><div><h2>Всё в порядке</h2><p>${meta}. Ничего делать не нужно.</p></div>${btnScan}</div>`;
  }
  let todo='';
  if(S.doneOnce&&!S.running&&iss.length){
    const top=iss.slice(0,5);
    todo=`<div class="hsec"><h3>Что нужно сделать <small>${iss.length>5?`показаны 5 самых важных из ${iss.length}`:`${iss.length}`}</small></h3>`+top.map(i=>{
      const rec=recommend(i),cat=CAT[i.cat];
      const why=(i.reasons&&i.reasons[0])||'Элемент выглядит необычно';
      const extra=i.cat==='defender'?'Защитник Windows уже изолировал эту угрозу. Достаточно отметить её прочитанной.':'';
      return `<div class="issue ${i.level}" data-id="${i.id}"><div class="it"><span class="lvl ${i.level}">${LV[i.level]}</span><b>${esc(i.name)}</b><span class="where">${esc(cat?cat.n:i.cat)}</span></div>
       <div class="why">${esc(extra||why)}</div><div class="pth" title="${esc(i.path||i.detail)}">${esc(i.path||i.detail)}</div>
       <div class="ia">${rec?`<button class="btn ${rec.k==='ack'?'primary':'danger'}" data-h="${rec.k}">${rec.l}</button>`:''}${S.set.whitelist&&i.cat!=='defender'?'<button class="btn" data-h="trust">Это безопасно</button>':''}${rec&&rec.k!=='ack'?'<button class="btn ghost" data-h="ack">В архив</button>':''}<button class="btn ghost" data-h="more">Подробнее</button></div></div>`;
    }).join('')+(iss.length>5?'<button class="btn" id="hAll">Показать все ('+iss.length+')</button>':'')+'</div>';
  }else if(S.doneOnce&&!S.running)todo='<div class="hsec"><h3>Что нужно сделать</h3><div class="chg"><div>Ничего. Подозрительных элементов нет — можно закрывать сканер.</div></div></div>';
  // что изменилось с прошлого анализа
  let chg='';
  if(S.doneOnce&&!S.running){
    const fresh=all.filter(i=>i.isnew),gone=Object.values(S.gone).flat();
    const rows=fresh.slice(0,6).map(i=>`<div><span class="k new">Новое</span><span>${esc(i.name)} <span style="color:var(--faint)">${esc((CAT[i.cat]||{n:i.cat}).n)}</span></span></div>`).concat(gone.slice(0,6).map(x=>`<div><span class="k gone">Пропало</span><span>${esc(x)}</span></div>`));
    chg=`<div class="hsec"><h3>Что изменилось с прошлого анализа <small>новых: ${fresh.length} · пропало: ${gone.length}</small></h3><div class="chg">${rows.length?rows.join(''):'<div>Изменений нет.</div>'}</div></div>`;
  }
  // плитки разделов
  const tile=(v,n,st,sub)=>`<button class="tile ${st||''}" data-go="${v}"><b><i></i>${n}</b><span>${sub}</span></button>`;
  const stat=f=>{const a=all.filter(f),d=a.filter(i=>i.level==='danger').length,w=a.filter(i=>i.level==='warn').length;return{st:d?'danger':w?'warn':'',sub:d?`опасно: ${d}`:w?`подозрительно: ${w}`:`элементов: ${a.length}`}};
  let tiles='';
  if(S.doneOnce){
    const mk=(v,n,f)=>{const x=stat(f);return tile(v,n,x.st,x.sub)};
    tiles=mk('autostart','Автозагрузка',i=>AUTO.has(i.cat))+mk('services','Службы',i=>i.cat==='services')+mk('processes','Процессы',i=>i.cat==='processes')+mk('network','Сеть',i=>i.cat==='network')+mk('hosts','Файл hosts',i=>i.cat==='hosts')+mk('files','Файлы и папки',i=>['files','temp','roaming','programdata'].includes(i.cat));
    if(S.set.defender)tiles+=mk('defender','Защитник Windows',i=>i.cat==='defender');
    tiles+=tile('archive','Архив','',`прочитано: ${arch}`)+tile('quarantine','Карантин','','удалённые файлы')+tile('journal','Журнал','','что и когда было');
  }
  L.innerHTML=`<div class="home">${hero}${todo}${chg}${tiles?`<div class="hsec"><h3>Разделы</h3><div class="tiles">${tiles}</div></div>`:''}</div>`;
}
$('#list').addEventListener('click',async e=>{
  if(S.view==='home'){
    const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
    if(e.target.closest('#hScan')){scanAll();return}
    if(e.target.closest('#hAll')){go('all');S.lv={danger:1,warn:1,note:0,ok:0,ack:0};draw();return}
    const b=e.target.closest('[data-h]'),card=e.target.closest('.issue');
    if(b&&card){
      const i=S.items.get(+card.dataset.id);if(!i)return;
      const k=b.dataset.h;
      if(k==='more')openDrawer(i.id);
      else if(k==='ack')ackItems([i.id],true);
      else if(k==='trust')trust([i.id],true);
      else if(k==='rm')confirmRemove([i.id]);
      else if(k==='both')removeBoth(i);
    }
    return;
  }
  const u=e.target.closest('[data-undo]');
  if(u&&S.view==='journal'){
    if(!confirm('Отменить это действие?'))return;
    const r=await api('/api/undo',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'token='+encodeURIComponent(u.dataset.undo)}).catch(()=>({ok:false,error:'нет связи со сканером'}));
    if(r.ok===false){toast(r.error||'не удалось отменить',true);return}
    if(r.items)applyItems(r.items);
    toast('Действие отменено. Чтобы увидеть изменения в списках, запустите проверку снова.');
    loadJournal();
  }
});
async function purgeFile(i){
  const p=i.full||i.path;
  if(!confirm(['Удалить файл навсегда?',p||i.path,'Он не попадёт в карантин и не будет восстановлен. Записи автозапуска, ведущие на него, останутся — удали их отдельно.'].join(String.fromCharCode(10)+String.fromCharCode(10))))return;
  const r=await api('/api/remove',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'mode=purge&ids='+i.id}).catch(()=>({results:[{ok:false,error:'нет связи со сканером'}]}));
  const x=(r.results||[])[0]||{ok:false,error:r.error||'не удалось'};
  if(!x.ok){toast(x.error||'не удалось удалить',true);return}
  S.items.delete(i.id);S.sel.delete(i.id);closeDrawer();draw();toast('Файл удалён навсегда');
}
async function hostDelete(i){
  if(!confirm(['Удалить запись из файла hosts?',i.detail,'Копия файла будет сохранена в папку hosts_backups.'].join('\n\n')))return;
  const r=await api('/api/hosts/change',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'op=remove&old='+encodeURIComponent(i.detail)}).catch(()=>({ok:false,error:'нет связи со сканером'}));
  if(!r.ok){toast(r.error||'не удалось удалить',true);return}
  closeDrawer();toast('Запись удалена');scanCat('hosts');
}
$('#hostAdd').onclick=()=>openHostEdit(null);
async function elevate(){
  if(S.info.admin){toast('Уже запущено от администратора');return}
  const r=await api('/api/elevate',{method:'POST'}).catch(()=>({ok:true}));
  if(!r.ok){toast(r.error,1);return}
  toast('Подтверди запрос Windows (UAC) — страница обновится сама');
  const t=setInterval(async()=>{try{const p=await (await fetch('/api/ping')).json();if(p.admin){clearInterval(t);location.reload()}}catch(_){}},1200);
}
$('#foot').onclick=e=>{if(e.target.tagName==='A')elevate()};
function mod(e){return e.ctrlKey||e.metaKey||e.altKey}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').classList.contains('on')){dmEdit=null;closeSettings()}else closeDrawer();return}
  if(e.key==='/'&&!mod(e)&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus()}
});

/* ---------- старт ---------- */
(async()=>{
  $('#fSort').value=S.sort;
  draw();
  try{
    S.info=await api('/api/info');
    const f=$('#foot');f.classList.toggle('lim',!S.info.admin);
    f.innerHTML=S.info.admin?'<i class="led"></i><span>Права администратора</span>':'<i class="led"></i><span>Ограниченные права</span><a>Повысить</a>';
    $('#mElev').style.display=S.info.admin?'none':'';
  }catch(e){}
  try{S.set=await api('/api/settings')}catch(e){}
  scanAll();
})();
</script>
